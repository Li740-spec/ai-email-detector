<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f4f7f6; }
    .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .gauge-container { width: 100px; height: 100px; margin: 0 auto; position: relative; }
    .gauge-bg { fill: none; stroke: #eee; stroke-width: 8; }
    .gauge-fill { 
      fill: none; stroke: #2ed573; stroke-width: 8; 
      stroke-dasharray: 251; stroke-dashoffset: 251; 
      transition: 1s; transform: rotate(-90deg); transform-origin: center; 
    }
    .gauge-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; }
    .status-msg { margin: 10px 0; font-size: 13px; font-weight: bold; color: #555; }
    .badge-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .badge { background: #e1eafc; font-size: 9px; padding: 3px 6px; border-radius: 4px; border: 1px solid #ced6e0; }
    button { width: 100%; padding: 10px; background: #2f3542; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="margin:0 0 10px 0;">AI 郵件安全專家</h3>
    <div class="gauge-container">
      <svg width="80" height="80" viewBox="0 0 100 100">
        <circle class="gauge-bg" cx="50" cy="50" r="40"></circle>
        <circle id="gaugeFill" class="gauge-fill" cx="50" cy="50" r="40"></circle>
      </svg>
      <div id="probText" class="gauge-text">0%</div>
    </div>
    <div id="statusMsg" class="status-msg">點擊按鈕掃描</div>
    <div id="badgeContainer" class="badge-container"></div>
    <button id="checkBtn">執行深度掃描</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
